<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Agents in production: Payment Posting Agent at 95% accuracy, Eligibility Calling Agent, Medalyze Flow."><style>
@font-face{font-family:'Sora';src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Manrope';src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Sora',sans-serif} .b{font-family:'Manrope',sans-serif}

.trace{animation:trace 3.2s linear infinite}
@keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rise{animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.trace,.blink,.rise{animation:none}}
</style><defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6CC04A" fill-opacity="0.10"/></pattern>
<linearGradient id="pulse" x1="0" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6CC04A" stop-opacity="0"/><stop offset="0.35" stop-color="#6CC04A" stop-opacity="0.9"/><stop offset="1" stop-color="#9BE07A"/></linearGradient>
</defs><rect width="1200" height="300" rx="24" fill="#07331F"/><rect width="1200" height="300" rx="24" fill="url(#dots)"/><text x="48" y="54" class="b" font-weight="600" font-size="12" letter-spacing="3" fill="#8FB886">AGENTS IN PRODUCTION</text><g class="rise" style="animation-delay:0.0s"><rect x="48" y="76" width="352" height="196" rx="18" fill="#0A4A2F" stroke="#6CC04A" stroke-opacity="0.28"/><rect x="72" y="98" width="62" height="24" rx="12" fill="#6CC04A" fill-opacity="0.16"/><circle class="blink" cx="86" cy="110" r="3.5" fill="#6CC04A"/><text x="96" y="114.5" class="b" font-weight="600" font-size="11" letter-spacing="1.5" fill="#9BE07A">LIVE</text><text x="72" y="156" class="d" font-weight="700" font-size="20" fill="#FFFFFF">Payment Posting Agent</text><text class="b" font-weight="500" font-size="14" fill="#CFE3C8"><tspan x="72" y="184">Posts payer payments to patient</tspan><tspan x="72" y="204">accounts without manual keying.</tspan></text><text x="72" y="250" class="d" font-weight="700" font-size="26" fill="#9BE07A">95%</text><text x="134" y="249" class="b" font-weight="500" font-size="13" fill="#8FB886">posting accuracy</text></g><g class="rise" style="animation-delay:0.15s"><rect x="424" y="76" width="352" height="196" rx="18" fill="#0A4A2F" stroke="#6CC04A" stroke-opacity="0.28"/><rect x="448" y="98" width="62" height="24" rx="12" fill="#6CC04A" fill-opacity="0.16"/><circle class="blink" cx="462" cy="110" r="3.5" fill="#6CC04A"/><text x="472" y="114.5" class="b" font-weight="600" font-size="11" letter-spacing="1.5" fill="#9BE07A">LIVE</text><text x="448" y="156" class="d" font-weight="700" font-size="20" fill="#FFFFFF">Eligibility Calling Agent</text><text class="b" font-weight="500" font-size="14" fill="#CFE3C8"><tspan x="448" y="184">Calls payers and verifies patient</tspan><tspan x="448" y="204">coverage before the visit.</tspan></text><text x="448" y="250" class="d" font-weight="700" font-size="26" fill="#9BE07A">AI</text><text x="484" y="249" class="b" font-weight="500" font-size="13" fill="#8FB886">voice agent on payer calls</text></g><g class="rise" style="animation-delay:0.3s"><rect x="800" y="76" width="352" height="196" rx="18" fill="#0A4A2F" stroke="#6CC04A" stroke-opacity="0.28"/><rect x="824" y="98" width="62" height="24" rx="12" fill="#6CC04A" fill-opacity="0.16"/><circle class="blink" cx="838" cy="110" r="3.5" fill="#6CC04A"/><text x="848" y="114.5" class="b" font-weight="600" font-size="11" letter-spacing="1.5" fill="#9BE07A">LIVE</text><text x="824" y="156" class="d" font-weight="700" font-size="20" fill="#FFFFFF">Medalyze Flow</text><text class="b" font-weight="500" font-size="14" fill="#CFE3C8"><tspan x="824" y="184">Ops platform: work orders, A/R and</tspan><tspan x="824" y="204">EV queues, client dashboards.</tspan></text><text x="824" y="250" class="d" font-weight="700" font-size="26" fill="#9BE07A">1</text><text x="846" y="249" class="b" font-weight="500" font-size="13" fill="#8FB886">platform, every team</text></g></svg>